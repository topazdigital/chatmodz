<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Chatmodz | Remote Chat Operator Jobs &amp; Conversation Operations</title>
    <meta name="description" content="Find remote chat operator work with Chatmodz. Join a focused conversation operations team, grow through clear operator levels, and earn per delivered message." />
    <meta name="keywords" content="remote chat operator jobs, chat moderator jobs, conversation operator, work from home chat jobs, paid messaging jobs" />
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="Chatmodz | Remote Chat Operator Jobs" />
    <meta property="og:description" content="A calm, secure workspace for remote chat operators. Apply, grow your level, and earn for every delivered reply." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Chatmodz" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Chatmodz | Remote Chat Operator Jobs" />
    <meta name="twitter:description" content="Join a focused remote chat operations team and grow through clear operator levels." />
    <meta name="theme-color" content="#18263c" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "JobPosting",
        "title": "Remote Chat Operator",
        "description": "Join Chatmodz as a remote chat operator. Work from a focused conversation workspace, build experience through clear operator levels, and earn per delivered reply.",
        "employmentType": "CONTRACTOR",
        "hiringOrganization": {
          "@type": "Organization",
          "name": "Chatmodz"
        },
        "jobLocationType": "TELECOMMUTE",
        "applicantLocationRequirements": {
          "@type": "AdministrativeArea",
          "name": "Worldwide"
        }
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Replit preview recovery: clear a stale demo session before React loads.
      if (new URLSearchParams(window.location.search).has("reset_session")) {
        try {
          localStorage.removeItem("chatmodz_auth");
        } catch {
          // Ignore storage restrictions; the login page can still render.
        }
        const cleanUrl = new URL(window.location.href);
        cleanUrl.searchParams.delete("reset_session");
        window.history.replaceState({}, "", cleanUrl.pathname + cleanUrl.search + cleanUrl.hash);
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
